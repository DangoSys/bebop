[workspace]
members = [
  ".",
  "src/nodes/bemu",
  "src/nodes/lib/bank-hash",
  "src/nodes/lib/bemu-profile",
  "src/nodes/lib/report",
  "src/nodes/lib/sim-build",
  "src/nodes/lib/terminal",
  "src/nodes/lib/trace-perfetto",
  "src/nodes/lib/vm",
  "src/nodes/lib/microphone",
  "src/nodes/lib/speaker",
  "src/nodes/lib/keyboard",
  "src/nodes/lib/memory",
  "src/nodes/lib/vga",
  "src/nodes/lib/rtc",
  "src/nodes/lib/fd-redirect",
  "src/nodes/lib/rtl-trace",
  "src/nodes/lib/syscall",
  "src/nodes/lib/uart",
  "src/nodes/verilator",
  "src/nodes/vcs",
  "src/nodes/p2e",
]
resolver = "2"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "bebop"
version = "0.1.0"
edition = "2021"
autobins = false
autotests = false

[[bin]]
name = "bebop"
path = "src/main.rs"

[[bin]]
name = "bebop-terminal"
path = "src/bin/bebop-terminal.rs"

[[bin]]
name = "bebop-trace-perfetto"
path = "src/bin/bebop-trace-perfetto.rs"

[[bin]]
name = "bebop-vm"
path = "src/bin/bebop-vm.rs"

[[test]]
name = "test_verilator"
path = "tests/test_verilator.rs"
harness = false
required-features = ["verilator"]

[[test]]
name = "test_p2e"
path = "tests/test_p2e.rs"
harness = false
required-features = ["p2e"]

[[test]]
name = "test_bemu"
path = "tests/test_bemu.rs"
harness = false
required-features = ["bemu"]

[features]
default = []
verilator = ["dep:bebop-verilator"]
p2e = ["dep:bebop-p2e", "bebop-bemu/p2e"]
bemu = ["bebop-p2e?/diff"]

[dependencies]
bebop-vcs = { path = "src/nodes/vcs" }
bebop-verilator = { path = "src/nodes/verilator", optional = true }
bebop-p2e = { path = "src/nodes/p2e", optional = true }
bebop-bemu = { path = "src/nodes/bemu" }
bebop-dasm = { path = "src/nodes/lib/dasm" }
bebop-bank-hash = { path = "src/nodes/lib/bank-hash" }
bebop-bemu-profile = { path = "src/nodes/lib/bemu-profile" }
bebop-report = { path = "src/nodes/lib/report" }
bebop-terminal = { path = "src/nodes/lib/terminal" }
bebop-trace-perfetto = { path = "src/nodes/lib/trace-perfetto" }
bebop-vm = { path = "src/nodes/lib/vm" }
bebop-fd-redirect = { path = "src/nodes/lib/fd-redirect" }
bebop-rtl-trace = { path = "src/nodes/lib/rtl-trace" }
bebop-uart = { path = "src/nodes/lib/uart" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["fs", "mman", "signal", "process"] }
toml = "0.8"
camino = "1.1"
snafu = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duct = "0.13"

[dev-dependencies]
libtest-mimic = "0.8"
assert_cmd = "2"
walkdir = "2"
predicates = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
