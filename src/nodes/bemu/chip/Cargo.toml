[package]
name = "bebop-bemu"
version = "0.1.0"
edition = "2021"

[lib]
path = "../../../../../../bebop/src/nodes/bemu/src/lib.rs"

[[bin]]
name = "bebop-bemu"
path = "../../../../../../bebop/src/nodes/bemu/src/main.rs"

[[test]]
name = "test_bemu"
path = "../../../../../../bebop/tests/test_bemu.rs"
harness = false

[dependencies]
memory = { package = "bebop-memory", path = "../../../../../../bebop/src/nodes/lib/memory" }
rvsim = { git = "https://github.com/DangoSys/riscv-cpu-sim", rev = "a1cdfd44707ee73549118917d1784f3b1bb22dec" }
rvv = { path = "../../../../../../bebop/src/nodes/bemu/rvv" }
bebop-dasm = { path = "../../../../../../bebop/src/nodes/lib/dasm" }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
snafu = "0.8"
prost = "0.13"
bebop-elf = { path = "../../../../../../bebop/src/nodes/lib/elf" }
bebop-syscall = { path = "../../../../../../bebop/src/nodes/lib/syscall" }
bebop-dtb = { path = "../../../../../../bebop/src/nodes/lib/dtb" }
bebop-clint = { path = "../../../../../../bebop/src/nodes/lib/clint" }
bebop-plic = { path = "../../../../../../bebop/src/nodes/lib/plic" }
bebop-microphone = { path = "../../../../../../bebop/src/nodes/lib/microphone" }
bebop-speaker = { path = "../../../../../../bebop/src/nodes/lib/speaker" }
bebop-keyboard = { path = "../../../../../../bebop/src/nodes/lib/keyboard" }
bebop-vga = { path = "../../../../../../bebop/src/nodes/lib/vga" }
bebop-vm = { path = "../../../../../../bebop/src/nodes/lib/vm", default-features = false }
bebop-rtc = { path = "../../../../../../bebop/src/nodes/lib/rtc" }
bebop-bank-hash = { path = "../../../../../../bebop/src/nodes/lib/bank-hash" }
bebop-bemu-profile = { path = "../../../../../../bebop/src/nodes/lib/bemu-profile" }
bebop-uart = { path = "../../../../../../bebop/src/nodes/lib/uart" }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
assert_cmd = "2"
walkdir = "2"
libtest-mimic = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
p2e = []
