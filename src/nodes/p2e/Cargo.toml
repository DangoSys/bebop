[package]
name = "bebop-p2e"
version = "0.1.0"
edition = "2021"

[lib]
name = "bebop_p2e"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
diff = []

[dependencies]
bebop-rtl-trace = { path = "../lib/rtl-trace" }
bebop-uart = { path = "../lib/uart" }
log = "0.4"
duct = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
duct = "0.13"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
